name: README live desktop screenshot
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/readme-screenshots.yml"
      - ".github/scripts/capture_desktop_screenshot.ps1"
      - "oplage_app.py"
      - "oplague_app.py"
      - "tools/**"
      - "README*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-live-workbench:
    name: OPlague live Windows workbench capture
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify OPlague sources and tests
        run: |
          python -m compileall -q oplague_app.py oplage_app.py tools
          python -m unittest discover -s tests -v
      - name: Capture running OPlague workbench
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $pythonw = $python -replace 'python.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-screenshot-oplage
          path: assets/screenshots/oplague-workbench.png
          if-no-files-found: error
          retention-days: 30
, 'pythonw.exe'
          if (-not (Test-Path $pythonw)) { throw "pythonw.exe was not found beside the configured Python runtime." }
          .github/scripts/capture_desktop_screenshot.ps1 -FilePath $pythonw -Arguments @("oplague_app.py") -OutputPath "assets/screenshots/oplague-workbench.png" -StartupSeconds 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-screenshot-oplage
          path: assets/screenshots/oplague-workbench.png
          if-no-files-found: error
          retention-days: 30
