name: OPlague offline inspection evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: ["automation/verified-build-artifacts-2026-11-28"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oplague-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tools and parser tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile offline tools
        run: python -m compileall -q oplague_app.py tools tests
      - name: Run offline unit and parser tests
        run: python -m unittest discover -s tests -v
