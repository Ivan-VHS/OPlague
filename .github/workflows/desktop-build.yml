name: OPlague Desktop Build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README*", "docs/**"]
  pull_request:
    paths: ["oplague_app.py", "oplage_app.py", "tests/**", ".github/workflows/desktop-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    name: Windows x64 desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compile and test
        run: |
          python -m compileall -q oplague_app.py oplage_app.py tests
          python tools/validate_visual_canon.py ui_theme.py
          python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OPlague oplague_app.py
      - name: Prepare distributable archive
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/OPlague.exe, dist/README.md, dist/LICENSE -DestinationPath OPlague-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OPlague-windows-x64
          path: OPlague-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OPlague-windows-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/OPlague-windows-x64.zip
