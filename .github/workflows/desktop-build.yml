name: OPlague Desktop Build
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README*", "docs/**"]
  pull_request:
    paths: ["oplague_app.py", "oplage_app.py", "tests/**", ".github/workflows/desktop-build.yml", ".github/scripts/capture_desktop_screenshot.ps1"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    permissions:
      contents: write
    name: Windows x64 desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compile and test
        run: |
          python -m compileall -q oplague_app.py oplage_app.py tests
          python tools/validate_visual_canon.py ui_theme.py
          python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OPlague oplague_app.py
      - name: Capture live Windows workstation
        shell: pwsh
        run: .github/scripts/capture_desktop_screenshot.ps1 -FilePath "dist/OPlague.exe" -OutputPath "assets/screenshots/oplague-workbench.png" -StartupSeconds 15
      - name: Upload live desktop screenshot
        uses: actions/upload-artifact@v4
        with:
          name: oplague-live-windows-screenshot
          path: assets/screenshots/oplague-workbench.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit screenshot to same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'refresh-screenshot')
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/screenshots/oplague-workbench.png"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: refresh live Windows screenshot"
            git fetch origin "$env:TARGET_BRANCH"
            git rebase "origin/$env:TARGET_BRANCH"
            git push origin "HEAD:$env:TARGET_BRANCH"
          } else {
            Write-Host "Screenshot is unchanged; no repository commit is needed."
          }
      - name: Prepare distributable archive
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/OPlague.exe, dist/README.md, dist/LICENSE -DestinationPath OPlague-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OPlague-windows-x64
          path: OPlague-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OPlague-windows-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/OPlague-windows-x64.zip
