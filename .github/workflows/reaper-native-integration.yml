name: Reaper native C17 integration
on:
  pull_request:
    paths:
      - "oplague/impact.py"
      - "tools/reaper_ffi.py"
      - "tests/test_reaper_ffi.py"
      - "tests/test_impact_profiles.py"
      - "integrations/reaper/**"
      - ".github/workflows/reaper-native-integration.yml"
  push:
    branches: [main, "feat/native-reaper-self-hosting"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reaper-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Ivan-VHS/Reaper
          ref: c810f2876e48211de801a9406cf97344e9f224ae
          path: _deps/Reaper
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and execute read-only device policy
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/Reaper
        run: |
          set -euo pipefail
          python -m reaper --check integrations/reaper/device_policy.rpr
          python -m reaper integrations/reaper/device_policy.rpr | tee reaper-device-policy.txt
          grep -qx "OPLAGUE_REAPER_DEVICE_POLICY:PASS" reaper-device-policy.txt
      - name: Validate and execute plugin trust policy
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/Reaper
        run: |
          set -euo pipefail
          python -m reaper --check integrations/reaper/plugin_trust.rpr
          python -m reaper integrations/reaper/plugin_trust.rpr | tee reaper-plugin-trust.txt
          grep -qx "OPLAGUE_REAPER_PLUGIN_TRUST:PASS" reaper-plugin-trust.txt
      - name: Validate and execute neural device-evidence policy
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/Reaper
        run: |
          set -euo pipefail
          python -m reaper --check integrations/reaper/neural_driver_policy.rpr
          python -m reaper integrations/reaper/neural_driver_policy.rpr | tee reaper-neural-policy.txt
          grep -qx "OPLAGUE_REAPER_NEURAL_POLICY:PASS" reaper-neural-policy.txt
      - name: Build Reaper native ABI without Python dependency
        run: |
          cmake -S _deps/Reaper -B _deps/Reaper/build -DREAPER_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build _deps/Reaper/build --parallel --target reaper_ffi_shared
      - name: Test the real shared ABI and OPlague integration
        shell: bash
        run: |
          library_link="$GITHUB_WORKSPACE/_deps/Reaper/build/libreaper_ffi.so"
          reaper_library="$(realpath -- "$library_link")"
          case "$reaper_library" in
            "$GITHUB_WORKSPACE"/_deps/Reaper/build/*) ;;
            *)
              echo "::error::Resolved Reaper library is outside the trusted build directory."
              exit 1
              ;;
          esac
          test -f "$reaper_library"
          export REAPER_LIBRARY="$reaper_library"
          python - <<'PY'
          import os
          from tools.reaper_ffi import evaluate_i64, lookup_selfhood

          library = os.environ["REAPER_LIBRARY"]
          assert evaluate_i64("6 * 7", library) == 42
          assert lookup_selfhood("Сам", library) == 2
          PY
          python -m oplague --rank-total-native --reaper-library "$REAPER_LIBRARY"
