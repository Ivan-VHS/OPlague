name: OPlague unit tests

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "oplage_app.py"
      - "oplague_app.py"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/device-catalog-tests.yml"
  pull_request:
    paths:
      - "oplage_app.py"
      - "oplague_app.py"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/device-catalog-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules and tests
        run: python -m compileall -q tools tests oplague_app.py oplage_app.py
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Check OPlague CLI
        run: python -m tools.oplague_cli --help
