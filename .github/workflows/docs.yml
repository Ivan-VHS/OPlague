name: Documentation checks

on:
  pull_request:
    paths:
      - "README.md"
      - "README.ru.md"
      - "README.uk.md"
      - "README.zh-CN.md"
      - "LICENSE"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_readme_links.py"
      - ".github/workflows/verified-auto-merge.yml"
  push:
    branches: ['**']
    paths:
      - "README.md"
      - "README.ru.md"
      - "README.uk.md"
      - "README.zh-CN.md"
      - "LICENSE"
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_readme_links.py"
      - ".github/workflows/verified-auto-merge.yml"

permissions:
  contents: read

jobs:
  README:
    name: README
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate language editions and navigation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md README.ru.md README.uk.md README.zh-CN.md; do
            test -s "$file"
            grep -q '^# OPlague' "$file"
          done
          grep -q '\[English\](README.md)' README.md
          grep -q '\[Русский\](README.ru.md)' README.md
          grep -q '\[Українська\](README.uk.md)' README.md
          grep -q '\[简体中文\](README.zh-CN.md)' README.md
          grep -q 'LICENSE' README.md

  LICENSE:
    name: LICENSE
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate license file
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
      - name: Validate local README links
        run: python .github/scripts/check_readme_links.py
