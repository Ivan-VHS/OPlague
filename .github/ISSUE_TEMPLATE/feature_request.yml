name: Feature request
description: Propose a bounded read-only OPlague improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Inspection problem to solve
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence source and proposed output
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, safety and resource limits
      description: Explain why the feature remains read-only.
    validations:
      required: true
