<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">OPlague evidence pipeline</title><desc id="desc">Read-only workflow from device inventory to driver package metadata inspection, structured evidence, and offline comparison and reporting. No driver installation or system modification occurs.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a2d"/><stop offset="1" stop-color="#153b5a"/></linearGradient><linearGradient id="blue"><stop stop-color="#70a5ff"/><stop offset="1" stop-color="#004e98"/></linearGradient><linearGradient id="red"><stop stop-color="#ff7b86"/><stop offset="1" stop-color="#b5122d"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ab6ff"/></marker></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/><circle cx="1050" cy="45" r="170" fill="#38bdf8" opacity=".09"/><text x="56" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">OPLAGUE / EVIDENCE MAP</text><text x="58" y="98" fill="#b3c4d6" font-family="Inter,Arial,sans-serif" font-size="15">Read-only Windows device and driver-package workbench</text>
<g font-family="Inter,Arial,sans-serif"><rect x="58" y="164" width="240" height="172" rx="18" fill="#0f2a45" stroke="#70a5ff" stroke-width="1.5"/><text x="82" y="201" fill="#8ab6ff" font-size="13" font-weight="700">01 / OBSERVE</text><text x="82" y="239" fill="#f8fafc" font-size="21" font-weight="800">Device inventory</text><text x="82" y="271" fill="#d0dce8" font-size="14">PnP identity</text><text x="82" y="294" fill="#d0dce8" font-size="14">Hardware IDs · status</text><text x="82" y="317" fill="#94a3b8" font-size="12">Read-only discovery</text>
<path d="M298 250H340" stroke="#8ab6ff" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="354" y="164" width="240" height="172" rx="18" fill="#102f4c" stroke="#70a5ff" stroke-width="1.5"/><text x="378" y="201" fill="#8ab6ff" font-size="13" font-weight="700">02 / INSPECT</text><text x="378" y="239" fill="#f8fafc" font-size="21" font-weight="800">INF / ZIP data</text><text x="378" y="271" fill="#d0dce8" font-size="14">Metadata · paths · hashes</text><text x="378" y="294" fill="#d0dce8" font-size="14">Architecture · size limits</text><text x="378" y="317" fill="#94a3b8" font-size="12">No package execution</text>
<path d="M594 250H636" stroke="#8ab6ff" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="650" y="164" width="240" height="172" rx="18" fill="#102a42" stroke="#34d399" stroke-width="1.5"/><text x="674" y="201" fill="#6ee7b7" font-size="13" font-weight="700">03 / RECORD</text><text x="674" y="239" fill="#f8fafc" font-size="21" font-weight="800">Evidence model</text><text x="674" y="271" fill="#d0dce8" font-size="14">Provenance · normalized IDs</text><text x="674" y="294" fill="#d0dce8" font-size="14">Candidate graph · advisory scores</text><text x="674" y="317" fill="#94a3b8" font-size="12">No automatic verdict</text>
<path d="M890 250H932" stroke="#8ab6ff" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="946" y="164" width="196" height="172" rx="18" fill="#0f2a45" stroke="#70a5ff" stroke-width="1.5"/><text x="970" y="201" fill="#8ab6ff" font-size="13" font-weight="700">04 / REVIEW</text><text x="970" y="239" fill="#f8fafc" font-size="21" font-weight="800">Compare</text><text x="970" y="271" fill="#d0dce8" font-size="14">Offline reports</text><text x="970" y="294" fill="#d0dce8" font-size="14">Metrics · snapshots</text><text x="970" y="317" fill="#94a3b8" font-size="12">Local output only</text></g>
<rect x="58" y="386" width="1084" height="116" rx="18" fill="#091523" stroke="#ff7b86" stroke-opacity=".8"/><circle cx="92" cy="429" r="9" fill="#ff7b86"/><text x="118" y="433" fill="#ff9aa2" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">READ-ONLY GUARANTEE</text><text x="84" y="471" fill="#e8edf2" font-family="Inter,Arial,sans-serif" font-size="17">No driver install · no load/unload · no enable/disable · no device or registry mutation</text>
<text x="58" y="558" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13">Evidence labels are not trust assertions. Hashes support integrity comparison; they do not prove publisher identity or compatibility.</text>
