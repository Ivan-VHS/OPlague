<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">OPlague driver workbench interface preview</title>
<desc id="desc">Illustrative reconstruction of the checked-in OPlague desktop layout: device inventory, package inspector, metric lab, and compatibility dry-run tabs. Not a live application screenshot.</desc>
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#070707"/><stop offset="1" stop-color="#181818"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#101010"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16345a" flood-opacity=".12"/></filter>
</defs>
<rect width="1440" height="900" rx="24" fill="#050505"/>
<rect x="16" y="16" width="1408" height="868" rx="18" fill="url(#paper)" stroke="#343434" stroke-width="2" filter="url(#shadow)"/>
<path d="M34 16h1372a18 18 0 0 1 18 18v132H16V34a18 18 0 0 1 18-18Z" fill="url(#navy)"/>
<text x="58" y="77" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#fff">OPLAGUE</text>
<text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#D8D8D8">Hardware inventory  /  Driver package inspection</text>
<rect x="16" y="166" width="1408" height="7" fill="#FF7777"/>
<g transform="translate(46 205)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">
  <rect width="1348" height="62" rx="10" fill="#181818" stroke="#b7c7d9"/>
  <rect x="8" y="8" width="234" height="46" rx="7" fill="#fff" stroke="#FFD700" stroke-width="2"/>
  <text x="125" y="37" text-anchor="middle" fill="#FFFFFF">Device inventory</text>
  <text x="373" y="37" text-anchor="middle" fill="#A3A3A3">Package inspector</text>
  <text x="630" y="37" text-anchor="middle" fill="#A3A3A3">Metric Lab</text>
  <text x="955" y="37" text-anchor="middle" fill="#A3A3A3">Compatibility &amp; dry-run</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif">
  <rect x="48" y="292" width="1344" height="80" rx="10" fill="#101010" stroke="#343434"/>
  <rect x="70" y="311" width="205" height="42" rx="7" fill="#FFD700"/>
  <text x="172" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Refresh hardware</text>
  <text x="300" y="337" font-size="16" fill="#A3A3A3">Read-only Windows Plug and Play inventory</text>
  <rect x="48" y="390" width="1344" height="380" rx="10" fill="#fff" stroke="#343434"/>
  <rect x="48" y="390" width="1344" height="52" rx="10" fill="#181818"/>
  <path d="M48 442h1344" stroke="#343434"/>
  <g font-size="16" font-weight="700" fill="#D8D8D8">
    <text x="76" y="423">Device</text><text x="488" y="423">Status</text><text x="680" y="423">Manufacturer</text><text x="954" y="423">Hardware ID</text>
  </g>
  <g font-size="17" fill="#A3A3A3" text-anchor="middle">
    <text x="720" y="590">Refresh hardware to populate the local device inventory</text>
    <text x="720" y="623" font-size="14">The preview contains no real device identifiers or system data</text>
  </g>
  <rect x="48" y="791" width="1344" height="50" rx="8" fill="#101010" stroke="#343434"/>
  <circle cx="72" cy="816" r="7" fill="#FF7777"/>
  <text x="92" y="822" font-size="15" fill="#D8D8D8">Local inspection only — no driver installation or deployment</text>
  <text x="1372" y="822" text-anchor="end" font-size="13" fill="#A3A3A3">DESKTOP WORKBENCH · WINDOWS</text>
</g>
<text x="1394" y="865" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#71849a">ILLUSTRATIVE UI PREVIEW · BASED ON oplage_app.py</text>
</svg>